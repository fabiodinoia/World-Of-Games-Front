<section class="profile" *ngIf="currentUser$ | async as user">
  <!-- User card -->
  <div class="profile__card panel">
    <div class="profile__header">
      <div class="profile__avatar">
        <img [src]="user.img" alt="User Avatar">
      </div>
      <div class="profile__info">
        <h1>{{ user.name }}</h1>
        <p class="profile__email">{{ user.email }}</p>
        <p class="profile__address" *ngIf="user.address">{{ user.address }}</p>
      </div>
    </div>
    <div class="profile__actions">
      <button type="button" class="btn btn--secondary btn--sm" (click)="editUser()">
        <mat-icon>edit</mat-icon>
        Edit profile
      </button>
      <button type="button" class="btn btn--danger btn--sm" (click)="logoutUser()">
        <mat-icon>exit_to_app</mat-icon>
        Logout
      </button>
      <button type="button" class="btn btn--ghost btn--sm profile__delete" (click)="deleteUser(user)">
        <mat-icon>delete_outline</mat-icon>
        Delete account
      </button>
    </div>
  </div>

  <!-- My games -->
  <div class="profile__games panel">
    <div class="profile__games-header">
      <h2>My Games</h2>
      <a class="btn btn--primary btn--sm" routerLink="/games/create">
        <mat-icon>add</mat-icon>
        Add game
      </a>
    </div>

    <ul class="profile__game-list" *ngIf="user.myGames?.length; else emptyState">
      <li class="profile__game-item" *ngFor="let game of user.myGames">
        <div class="profile__game-info">
          <img class="profile__game-img" [src]="game.img" [alt]="game.gameName" loading="lazy">
          <div class="profile__game-details">
            <p class="profile__game-name">{{ game.gameName }}</p>
            <span class="badge">{{ game.category }}</span>
            <p class="profile__game-price">{{ game.price | currency:'EUR' }}</p>
          </div>
        </div>
        <div class="profile__game-actions">
          <button type="button" class="btn btn--icon" (click)="editGame(game)" aria-label="Edit game">
            <mat-icon>edit</mat-icon>
          </button>
          <button type="button" class="btn btn--icon" (click)="deleteGame(game)" aria-label="Delete game">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </li>
    </ul>

    <ng-template #emptyState>
      <div class="profile__empty">
        <mat-icon>sports_esports</mat-icon>
        <p>You haven't published any games yet.</p>
        <a class="btn btn--secondary btn--sm" routerLink="/games/create">Publish your first game</a>
      </div>
    </ng-template>
  </div>
</section>
