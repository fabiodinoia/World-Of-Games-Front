<div class="detail-page" *ngIf="game.id; else loadingState">
  <!-- Back link -->
  <a class="detail-page__back" routerLink="/games">
    <mat-icon>arrow_back</mat-icon>
    Back to browse
  </a>

  <section class="detail-page__content panel">
    <!-- Hero image -->
    <div class="detail-page__hero">
      <img [src]="game.img" [alt]="game.gameName" loading="lazy">
    </div>

    <!-- Info panel -->
    <div class="detail-page__info">
      <span class="badge">{{ game.category }}</span>
      <h1>{{ game.gameName }}</h1>

      <div class="detail-page__meta">
        <p class="detail-page__release">
          <mat-icon>calendar_today</mat-icon>
          {{ game.releaseDate }}
        </p>
      </div>

      <p class="detail-page__description" *ngIf="game.description">
        {{ game.description }}
      </p>

      <div class="detail-page__purchase">
        <p class="detail-page__price">{{ game.price | currency:'EUR' }}</p>
        <button class="btn btn--primary" type="button" (click)="addToCart()">
          <mat-icon>add_shopping_cart</mat-icon>
          Add to Cart
        </button>
      </div>
    </div>
  </section>
</div>

<ng-template #loadingState>
  <div class="detail-page__loading panel">
    <div class="skeleton" style="width: 100%; height: 320px; border-radius: 20px;"></div>
    <div style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem;">
      <div class="skeleton" style="height: 1rem; width: 80px;"></div>
      <div class="skeleton" style="height: 2rem; width: 60%;"></div>
      <div class="skeleton" style="height: 1rem; width: 40%;"></div>
      <div class="skeleton" style="height: 4rem; width: 100%;"></div>
    </div>
  </div>
</ng-template>
