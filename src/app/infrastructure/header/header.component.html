<header class="header">
  <div class="header__inner">
    <a class="header__logo" routerLink="/home">
      <img alt="World of Games logo" src="/assets/WOG-logo2.png">
    </a>

    <nav class="header__nav" [class.header__nav--open]="mobileMenuOpen">
      <a class="header__link" routerLink="/home"
         [class.header__link--active]="isActive('/home')"
         (click)="mobileMenuOpen = false">
        Home
      </a>
      <a class="header__link" routerLink="/games"
         [class.header__link--active]="isActive('/games')"
         (click)="mobileMenuOpen = false">
        Browse Games
      </a>
      <a class="header__link header__link--cart" routerLink="/cart"
         [class.header__link--active]="isActive('/cart')"
         *ngIf="isLoggedIn"
         (click)="mobileMenuOpen = false">
        Cart
        <span class="header__badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
    </nav>

    <div class="header__actions">
      <ng-container *ngIf="isLoggedIn; else authButtons">
        <a class="header__user" [routerLink]="['/user', userId]">
          <mat-icon>account_circle</mat-icon>
          <span class="header__user-name">{{ userName || 'Account' }}</span>
        </a>
      </ng-container>
      <ng-template #authButtons>
        <a class="btn btn--sm btn--ghost" routerLink="/login">Login</a>
        <a class="btn btn--sm btn--primary" routerLink="/register">Register</a>
      </ng-template>
    </div>

    <button class="header__hamburger" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <span [class.open]="mobileMenuOpen"></span>
      <span [class.open]="mobileMenuOpen"></span>
      <span [class.open]="mobileMenuOpen"></span>
    </button>
  </div>
</header>
