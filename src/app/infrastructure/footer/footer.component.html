<footer class="footer-bar">
  <div class="footer-bar__inner">
    <p class="footer-bar__text">
      <ng-container *ngIf="currentPage === '/login'">
        Don't have an account yet? <a routerLink="/register" class="footer-bar__link">Register</a>
      </ng-container>
      <ng-container *ngIf="currentPage === '/register' && !isLogged">
        Already have an account? <a routerLink="/login" class="footer-bar__link">Login</a>
      </ng-container>
      <ng-container *ngIf="currentPage === '/home' || currentPage === '/'">
        Don't have an account yet? <a routerLink="/register" class="footer-bar__link">Register</a>
      </ng-container>
    </p>
  </div>
</footer>
